<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Personal Money Control & Finance Manager — Track cash, bank balances, loans, EMI, insurance, and freelance income in one place.">
  <meta name="theme-color" content="#6366F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Money Manager">

  <title>Money Manager — Personal Finance Control</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Favicon / Icons -->
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pages.css">
</head>
<body>

<div id="app">

  <!-- ========== SIDEBAR (Desktop) ========== -->
  <aside class="sidebar" role="navigation" aria-label="Main navigation">
    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon"><i class="fas fa-wallet"></i></div>
      <div class="sidebar-logo-text">
        <h1>Money Manager</h1>
        <span>Personal Finance</span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <div class="nav-item active" data-page="dashboard" role="button" tabindex="0" aria-label="Dashboard">
        <i class="fas fa-house"></i> Dashboard
      </div>
      <div class="nav-item" data-page="money" role="button" tabindex="0" aria-label="Money">
        <i class="fas fa-wallet"></i> My Money
      </div>
      <div class="nav-item" data-page="loans" role="button" tabindex="0" aria-label="Loans">
        <i class="fas fa-hand-holding-dollar"></i> Loans
      </div>

      <div class="sidebar-section-label">Payments</div>
      <div class="nav-item" data-page="payments" role="button" tabindex="0" aria-label="Payments">
        <i class="fas fa-calendar-check"></i> Payments / EMI
        <span class="nav-badge" id="notif-badge" style="display:none">0</span>
      </div>
      <div class="nav-item" data-page="insurance" role="button" tabindex="0" aria-label="Insurance">
        <i class="fas fa-shield-halved"></i> Insurance
      </div>

      <div class="sidebar-section-label">Income</div>
      <div class="nav-item" data-page="freelancing" role="button" tabindex="0" aria-label="Freelancing">
        <i class="fas fa-laptop-code"></i> Freelancing
      </div>
      <div class="nav-item" data-page="live" role="button" tabindex="0" aria-label="Live Earnings">
        <i class="fas fa-stopwatch"></i> Live Earnings
      </div>
      <div class="nav-item" data-page="reports" role="button" tabindex="0" aria-label="Reports">
        <i class="fas fa-chart-pie"></i> Reports
      </div>

      <div class="sidebar-section-label">App</div>
      <div class="nav-item" data-page="settings" role="button" tabindex="0" aria-label="Settings">
        <i class="fas fa-gear"></i> Settings
      </div>
    </nav>

    <!-- Dark mode in sidebar bottom -->
    <div class="sidebar-bottom">
      <div class="nav-item" id="dark-mode-toggle" role="button" tabindex="0">
        <i class="fas fa-circle-half-stroke"></i> Toggle Theme
      </div>
    </div>
  </aside>

  <!-- ========== MAIN CONTENT ========== -->
  <div class="main-content">

    <!-- Top Bar (Desktop) -->
    <header class="topbar" role="banner">
      <div class="topbar-title">
        <h2>Dashboard</h2>
        <p id="topbar-sub">Loading...</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-icon" id="dark-mode-toggle-top" title="Toggle Dark Mode" onclick="toggleTheme()">
          <i class="fas fa-circle-half-stroke"></i>
        </button>
        <button class="btn btn-primary" id="topbar-add-btn" onclick="showFabMenu()">
          <i class="fas fa-plus"></i> Add
        </button>
      </div>
    </header>

    <!-- Mobile Top Bar -->
    <div class="mobile-topbar">
      <h2>Dashboard</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-icon" onclick="toggleTheme()">
          <i class="fas fa-circle-half-stroke"></i>
        </button>
        <button class="btn btn-ghost btn-icon" onclick="navigate('settings')">
          <i class="fas fa-gear"></i>
        </button>
      </div>
    </div>

    <!-- Page Content -->
    <main class="page-content" role="main">

      <!-- Dashboard Page -->
      <section id="page-dashboard" class="page active"></section>

      <!-- Money Page -->
      <section id="page-money" class="page"></section>

      <!-- Loans Page -->
      <section id="page-loans" class="page"></section>

      <!-- Payments Page -->
      <section id="page-payments" class="page"></section>

      <!-- Insurance Page -->
      <section id="page-insurance" class="page"></section>

      <!-- Freelancing Page -->
      <section id="page-freelancing" class="page"></section>

      <!-- Reports Page -->
      <section id="page-reports" class="page"></section>

      <!-- Settings Page -->
      <section id="page-settings" class="page"></section>

      <!-- Live Earnings Page -->
      <section id="page-live" class="page"></section>

    </main>
  </div>
</div>

<!-- ========== MOBILE BOTTOM NAV ========== -->
<nav class="bottom-nav" role="navigation" aria-label="Mobile navigation">
  <div class="bottom-nav-items">
    <div class="bottom-nav-item active" data-page="dashboard" role="button" tabindex="0" aria-label="Dashboard">
      <i class="fas fa-house"></i>
      <span>Home</span>
    </div>
    <div class="bottom-nav-item" data-page="money" role="button" tabindex="0" aria-label="Money">
      <i class="fas fa-wallet"></i>
      <span>Money</span>
    </div>
    <div class="bottom-nav-item" data-page="loans" role="button" tabindex="0" aria-label="Loans">
      <i class="fas fa-hand-holding-dollar"></i>
      <span>Loans</span>
    </div>
    <div class="bottom-nav-item" data-page="payments" role="button" tabindex="0" aria-label="Payments">
      <i class="fas fa-calendar-check"></i>
      <span>EMI</span>
    </div>
    <div class="bottom-nav-item" id="more-nav-btn" role="button" tabindex="0" aria-label="More">
      <i class="fas fa-ellipsis"></i>
      <span>More</span>
    </div>
  </div>
</nav>

<!-- ========== FAB BUTTON (Mobile) ========== -->
<button class="fab" id="fab-add" aria-label="Add transaction">
  <i class="fas fa-plus"></i>
</button>

<!-- ========== SCRIPTS ========== -->
<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>

<!-- Database layer -->
<script src="./js/db.js"></script>
<!-- Utilities -->
<script src="./js/utils.js"></script>
<!-- App (must be before page scripts) -->
<script src="./js/app.js"></script>

<!-- Page scripts -->
<script src="./js/dashboard.js"></script>
<script src="./js/money.js"></script>
<script src="./js/loans.js"></script>
<script src="./js/payments.js"></script>
<script src="./js/insurance.js"></script>
<script src="./js/freelancing.js"></script>
<script src="./js/reports.js"></script>
<script src="./js/settings.js"></script>
<script src="./js/live.js"></script>

<script>
  // Fix topbar subtitle reference
  document.addEventListener('DOMContentLoaded', () => {
    const topbarSub = document.querySelector('.topbar-title p');
    if (topbarSub) topbarSub.id = 'topbar-sub-el';
  });
</script>

</body>
</html>
